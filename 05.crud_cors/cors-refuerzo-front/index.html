<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos</title>
</head>
<body>
    <h1>Datos del Backend</h1>
    
    <h2>Todos los Datos</h2>
    <button id="loadDataBtn">Cargar Datos Completos</button>
    <div id="datosContainer"></div>

        <div>
            <label for="searcher">Buscar por nombre:</label>
            <input type="text" id="searcher" name="searcher" required>
        </div>
        <button type="submit">Buscar</button>
    </form>
    <div id="result"></div>

    <script src="js/script.js"></script>
</body>
</html>
